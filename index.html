<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f0f13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="QR受付">
  <title>QR受付 | S.O.P. Dance School</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <style>
    /* touch-action:manipulation で二重タップ拡大を全体で無効化 */
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: #0f0f13;
      color: #f0f0f0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── ヘッダー ── */
    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      border-bottom: 1px solid #1e1e2e;
      flex-shrink: 0;
    }
    .hd-school { font-size: 0.6rem; letter-spacing: 0.15em; color: #5050a0; text-transform: uppercase; }
    .hd-title  { font-size: 1rem; font-weight: 700; color: #c0c0e0; margin-top: 2px; display: flex; align-items: center; gap: 6px; }
    .cache-dot { width: 7px; height: 7px; border-radius: 50%; background: #303050; flex-shrink: 0; transition: background 0.4s; }
    .cache-dot.ready { background: #40c070; }
    .hd-right  { display: flex; align-items: center; gap: 14px; }
    .hd-time   { text-align: right; }
    .hd-date   { font-size: 0.65rem; color: #5050a0; }
    .hd-clock  { font-size: 1.25rem; font-weight: 700; color: #7c6fff; font-variant-numeric: tabular-nums; }

    /* ── 受付モード切替（月謝 / 回数券） ── */
    .mode-switch {
      display: flex; border: 1px solid #2a2a3a; border-radius: 10px; overflow: hidden;
    }
    .ms-btn {
      background: #14141c; border: none; color: #5050a0;
      font-size: 0.75rem; font-weight: 700; font-family: inherit;
      padding: 8px 12px; cursor: pointer; white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .ms-btn.active { background: #7c6fff; color: #fff; }
    /* 手動で選んでいる間だけ出る目印。押すと自動に戻る */
    .mode-badge {
      background: #33200f; border: 1px solid #5c3c1f; border-radius: 8px;
      color: #e0a060; font-size: 0.68rem; font-weight: 700; font-family: inherit;
      padding: 6px 9px; cursor: pointer; white-space: nowrap;
    }
    .mode-badge:active { background: #4a2f16; }
    /* 回数券の窓口対応（引き継ぎ・チャージ）へ。目立ちすぎないよう小さく */
    .hd-ticket-link {
      color: #5aa2e8; font-size: 0.72rem; text-decoration: none; white-space: nowrap;
      border: 1px solid #24405e; border-radius: 6px; padding: 6px 9px; opacity: .85;
    }
    .hd-ticket-link:hover { opacity: 1; background: #14243c; }
    /* 回数券モード中は背景をブルー系にして一目で分かるように */
    body.ticket-mode { background: #0c1a30; }
    body.ticket-mode header        { border-bottom-color: #1e3a5e; }
    body.ticket-mode .mode-tabs    { border-bottom-color: #1e3a5e; }
    body.ticket-mode .ms-btn.active { background: #2f7ad0; }
    body.ticket-mode .camera-wrap,
    body.ticket-mode .history-panel { background: #14243c; border-color: #24405e; }
    body.ticket-mode .hd-clock      { color: #5aa2e8; }

    /* ── モードタブ ── */
    .mode-tabs {
      width: 100%; display: flex;
      border-bottom: 1px solid #1e1e2e;
    }
    .mode-tab {
      flex: 1; padding: 20px 10px;
      font-size: 1.1rem; font-weight: 700;
      text-align: center; cursor: pointer;
      color: #5050a0; background: none; border: none;
      border-bottom: 3px solid transparent;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .mode-tab.active { color: #7c6fff; border-bottom-color: #7c6fff; background: #15151f; }

    /* ── メイン ── */
    .main {
      flex: 1; width: 100%;
      display: flex; flex-direction: column;
      align-items: center;
      padding: 14px 16px; gap: 12px;
    }

    /* ── カメラ ── */
    .camera-wrap {
      position: relative; width: 100%; max-width: 370px;
      aspect-ratio: 1; border-radius: 16px; overflow: hidden;
      background: #1a1a24; border: 2px solid #2a2a3a;
    }
    #video { width: 100%; height: 100%; object-fit: cover; display: block; }
    #video.mirror { transform: scaleX(-1); } /* iPadフロントカメラの鏡像表示 */

    .scan-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    /* スキャン枠：中央を明るく、外側を暗くマスクして「ここにかざす」を明示 */
    .scan-window {
      position: relative;
      width: 66%; aspect-ratio: 1;
      border-radius: 18px;
      border: 2px solid rgba(124,111,255,0.55);
      box-shadow: 0 0 0 2000px rgba(8,8,14,0.5); /* 枠の外を暗く */
      display: flex; align-items: center; justify-content: center;
    }
    /* 四隅の太いコーナー（1つの大きな枠だと分かるように） */
    .sw-corner { position: absolute; width: 30px; height: 30px; border: 4px solid #7c6fff; }
    .sw-corner.tl { top: -2px; left: -2px;  border-right: none;  border-bottom: none; border-radius: 14px 0 0 0; }
    .sw-corner.tr { top: -2px; right: -2px; border-left: none;   border-bottom: none; border-radius: 0 14px 0 0; }
    .sw-corner.bl { bottom: -2px; left: -2px;  border-right: none; border-top: none;  border-radius: 0 0 0 14px; }
    .sw-corner.br { bottom: -2px; right: -2px; border-left: none;  border-top: none;  border-radius: 0 0 14px 0; }
    /* 枠内のQRサンプル透かし */
    .scan-qr-sample {
      width: 58%; height: 58%;
      color: #fff; opacity: 0.16; pointer-events: none;
    }

    #btnFlip {
      position: absolute; top: 10px; right: 10px;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(15,15,19,0.6); border: 1px solid #3a3a5a;
      color: #a0a0c0; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px); z-index: 10;
    }
    #btnFlip svg { width: 20px; height: 20px; }
    #btnFlip:active { background: rgba(124,111,255,0.4); }

    /* ── ステータス ── */
    .status { font-size: 0.82rem; color: #6060a0; text-align: center; min-height: 1.5em; }
    .status.error { color: #d06060; }

    /* ── 手入力パネル ── */
    #manualPanel {
      width: 100%; max-width: 370px;
      display: none; flex-direction: column; gap: 12px;
    }

    /* サブタブ（番号 / 名前） */
    .sub-tabs {
      display: flex; border-radius: 10px; overflow: hidden;
      border: 1px solid #2a2a3a;
    }
    .sub-tab {
      flex: 1; padding: 9px;
      font-size: 0.8rem; font-weight: 600;
      text-align: center; cursor: pointer;
      color: #5050a0; background: #1a1a24; border: none;
      transition: color 0.2s, background 0.2s;
    }
    .sub-tab.active { color: #fff; background: #7c6fff; }
    .sub-tab:first-child { border-right: 1px solid #2a2a3a; }

    /* ── 番号入力ペイン ── */
    .num-display {
      background: #1a1a24; border: 2px solid #2a2a3a;
      border-radius: 12px; padding: 14px 18px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .num-display label { font-size: 0.65rem; color: #5050a0; text-transform: uppercase; letter-spacing: 0.1em; }
    .num-digits {
      font-size: 2rem; font-weight: 800; letter-spacing: 0.25em;
      color: #7c6fff; min-height: 2.5rem; font-variant-numeric: tabular-nums;
    }
    .num-digits.complete { color: #60d080; }
    .num-name  { font-size: 0.9rem; color: #c0c0e0; min-height: 1.4em; }
    .num-hint  { font-size: 0.7rem; color: #404060; }

    .numpad {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .key {
      background: #1a1a24; border: 1px solid #2a2a3a;
      border-radius: 10px; padding: 16px 0;
      font-size: 1.4rem; font-weight: 600; color: #c0c0e0;
      cursor: pointer; text-align: center; user-select: none;
      -webkit-user-select: none;
      transition: background 0.08s;
    }
    .key:active { background: #2a2a4a; }
    .key.zero  { grid-column: 1; }
    .key.del   { font-size: 1.1rem; color: #7060a0; }
    .key.empty { background: none; border: none; pointer-events: none; }

    .manual-actions {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .btn-submit {
      padding: 14px; border-radius: 12px; border: none;
      background: #7c6fff; color: #fff;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-submit:disabled { opacity: 0.3; cursor: default; }
    .btn-submit:not(:disabled):active { opacity: 0.8; }
    .btn-clear {
      padding: 14px; border-radius: 12px;
      border: 1px solid #3a3a5a; background: none;
      color: #6060a0; font-size: 0.9rem; cursor: pointer;
    }
    .btn-clear:active { background: #1a1a24; }

    /* ── 名前検索ペイン ── */
    #namePane { display: flex; flex-direction: column; gap: 10px; }

    .name-search-box {
      background: #1a1a24; border: 2px solid #2a2a3a;
      border-radius: 12px; padding: 12px 16px;
      display: flex; align-items: center; gap: 10px;
    }
    .name-search-box:focus-within { border-color: #7c6fff; }
    .name-search-box span { font-size: 1.1rem; color: #5050a0; flex-shrink: 0; }
    #nameInput {
      flex: 1; background: none; border: none; outline: none;
      font-size: 1.05rem; color: #e0e0f0;
      font-family: inherit;
    }
    #nameInput::placeholder { color: #404060; }
    #nameClear {
      background: none; border: none; color: #404060;
      font-size: 1.2rem; cursor: pointer; padding: 2px 4px;
      display: none;
    }
    #nameClear.show { display: block; }

    .name-results { display: flex; flex-direction: column; gap: 6px; max-height: 320px; overflow-y: auto; }
    .name-result {
      background: #1a1a24; border: 1px solid #2a2a3a;
      border-radius: 10px; padding: 12px 14px; cursor: pointer;
      display: flex; flex-direction: column; gap: 3px;
      transition: border-color 0.15s, background 0.15s;
    }
    .name-result:active { background: #2a2a4a; border-color: #7c6fff; }
    .nr-name { font-size: 1rem; font-weight: 700; color: #e0e0f0; }
    .nr-kana { font-size: 0.78rem; color: #7060a0; }
    .nr-id   { font-size: 0.72rem; color: #404060; }
    .name-msg { font-size: 0.82rem; color: #404060; text-align: center; padding: 20px 0; }
    .name-subhint { display: none; font-size: 0.78rem; color: #404060; padding: 0 4px; }

    /* 名前ペインの左右カラム（スマホは縦積み・iPadで2カラム化） */
    .np-left  { display: flex; flex-direction: column; gap: 10px; }
    .np-right { min-width: 0; }

    /* ── フリックキーボード（既定は非表示・iPadのみ表示） ── */
    .flick-kb { display: none; }
    #flick-popup { display: none; }

    /* ── 受付履歴パネル ── */
    /* 受付履歴はQRスキャン時のみ表示（手入力時は隠す） */
    body.mode-manual .history-panel,
    body.mode-manual .counter { display: none; }

    .history-panel {
      width: 100%; max-width: 370px;
      background: #1a1a24; border-radius: 12px;
      padding: 12px 16px; border: 1px solid #2a2a3a;
      display: flex; flex-direction: column; gap: 8px;
    }
    .history-panel > label { font-size: 0.65rem; color: #5050a0; text-transform: uppercase; letter-spacing: 0.1em; }
    #historyList { display: flex; flex-direction: column; }
    .hist-empty { font-size: 0.9rem; color: #2e2e4e; padding: 4px 0; }
    .hist-item {
      display: flex; flex-direction: column; gap: 2px;
      padding: 8px 0; border-bottom: 1px solid #1e1e28;
    }
    .hist-item:last-child { border-bottom: none; padding-bottom: 0; }
    .hist-name { font-size: 0.95rem; font-weight: 700; color: #c0c0e0; }
    .hist-meta { font-size: 0.7rem; color: #484868; }
    .hist-item.latest .hist-name { font-size: 1.05rem; color: #e8e8ff; }
    .hist-item.latest .hist-meta { color: #6060a0; }
    .counter { font-size: 0.72rem; color: #404060; }

    footer { font-size: 0.65rem; color: #252540; padding: 10px; letter-spacing: 0.05em; }

    /* ── 確認モーダル ── */
    #confirm-overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(10,10,18,0.88);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      z-index: 190; padding: 32px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.18s ease;
    }
    #confirm-overlay.visible { opacity: 1; pointer-events: auto; }

    .cf-box {
      width: 100%; max-width: 340px;
      background: #1a1a24; border: 1px solid #2a2a3a;
      border-radius: 20px; padding: 28px 24px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      animation: popIn 0.25s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    .cf-label { font-size: 0.7rem; color: #5050a0; letter-spacing: 0.12em; text-transform: uppercase; }
    .cf-name  { font-size: clamp(1.4rem, 7vw, 2rem); font-weight: 800; color: #fff; text-align: center; line-height: 1.3; }
    .cf-id    { font-size: 0.8rem; color: #5050a0; }
    .cf-btns  { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .cf-ok {
      padding: 15px; border-radius: 12px; border: none;
      background: #7c6fff; color: #fff;
      font-size: 1rem; font-weight: 700; cursor: pointer;
    }
    .cf-ok:active { opacity: 0.8; }
    .cf-cancel {
      padding: 15px; border-radius: 12px;
      border: 1px solid #3a3a5a; background: none;
      color: #6060a0; font-size: 0.95rem; cursor: pointer;
    }
    .cf-cancel:active { background: #1e1e2e; }

    /* ── フラッシュ ── */
    .flash { position: fixed; inset: 0; background: #7c6fff; opacity: 0; pointer-events: none; z-index: 100; }
    .flash.active { animation: flashAnim 0.25s ease-out forwards; }
    @keyframes flashAnim { 0%{ opacity:0.4; } 100%{ opacity:0; } }

    /* ── 結果オーバーレイ ── */
    #result-overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(10,10,18,0.93);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      z-index: 200; padding: 32px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease;
    }
    #result-overlay.visible { opacity:1; pointer-events:auto; }

    .ov-icon {
      width: 64px; height: 64px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 18px;
      animation: popIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    .ov-icon.ok  { background:#7c6fff; box-shadow:0 0 40px #7c6fff80; }
    .ov-icon.err { background:#6f2020; box-shadow:0 0 40px #6f202080; }
    .ov-icon svg { width:32px; height:32px; stroke:#fff; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    @keyframes popIn { 0%{transform:scale(0.5);opacity:0;} 100%{transform:scale(1);opacity:1;} }

    .ov-label { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 10px; }
    .ov-label.ok  { color: #7c6fff; }
    .ov-label.err { color: #d06060; }

    .ov-name {
      font-size: clamp(2rem, 10vw, 3.2rem);
      font-weight: 800; color: #fff;
      text-align: center; line-height: 1.2; margin-bottom: 10px;
    }
    .ov-meta { font-size: 1rem; color: #6060a0; text-align: center; }
    /* 回数券の残数。名前の次に大きく出す。
       「いまの残り → 今回のクラスを確定したあとの残り」を矢印で示して、
       引かれる前の数字か後の数字かで迷わないようにする */
    .ov-ticket { display: none; margin-top: 14px; padding: 10px 22px; border-radius: 12px;
      font-size: 1.45rem; font-weight: 800; text-align: center; line-height: 1.3; }
    .ov-ticket.ok   { display: block; background: #12301f; color: #5fd08a; border: 1px solid #1f5c38; }
    .ov-ticket.warn { display: block; background: #33200f; color: #e0a060; border: 1px solid #5c3c1f; }
    .ov-ticket.info { display: block; background: #14243c; color: #5aa2e8; border: 1px solid #24405e; }
    .tk-label { font-size: 0.62em; font-weight: 700; opacity: 0.75; margin-right: 0.5em; }
    .tk-from  { opacity: 0.6; }
    .tk-arrow { margin: 0 0.32em; opacity: 0.8; }
    .tk-to    { font-size: 1.45em; }              /* 確定後の数字を一番大きく */
    .tk-unit  { font-size: 0.66em; margin-left: 0.1em; }
    .tk-note  { display: block; margin-top: 4px; font-size: 0.56em; font-weight: 700; opacity: 0.9; }
    .ov-welcome { margin-top: 16px; font-size: clamp(1rem, 4vw, 1.4rem); font-weight: 700; color: #c0f0d0; text-align: center; }
    .ov-sub { margin-top: 8px; font-size: 0.78rem; color: #404060; text-align: center; min-height: 1.2em; }
    .ov-hint { margin-top: 24px; font-size: 0.7rem; color: #303050; }

    .ov-progress {
      position: absolute; bottom:0; left:0;
      height: 3px; background: #7c6fff;
      width: 100%; transform-origin: left;
    }
    .ov-progress.run { animation: shrink var(--dur, 3s) linear forwards; }
    @keyframes shrink { 0%{transform:scaleX(1);} 100%{transform:scaleX(0);} }

    /* ═══════════════════════════════════════════════════════
       iPad レイアウト（768px 以上）
       ─ スマホ CSS は上書きせず、必要な箇所のみ追加・拡張
    ═══════════════════════════════════════════════════════ */
    @media (min-width: 768px) {

      /* ── ヘッダー ── */
      header       { padding: 18px 40px; }
      .ms-btn      { font-size: 1rem; padding: 12px 20px; }
      .hd-school   { font-size: 0.8rem; }
      .hd-title    { font-size: 1.35rem; gap: 8px; }
      .hd-date     { font-size: 0.8rem; }
      .hd-clock    { font-size: 2rem; }
      .cache-dot   { width: 10px; height: 10px; }

      /* ── モードタブ ── */
      .mode-tab { padding: 32px 24px; font-size: 1.5rem; letter-spacing: 0.04em; border-bottom-width: 4px; }

      /* ── メイン：2カラムグリッド ──
         左列（1fr）：QRパネル or 手入力パネル
         右列（360px）：最後の受付カード + カウンター
      ── */
      .main {
        display: grid;
        grid-template-columns: 1fr 360px;
        align-items: start;
        gap: 18px 32px;
        padding: 18px 40px;
        max-width: 1200px;
        margin: 0 auto;
      }
      footer { padding: 6px; }

      #qrPanel       { grid-column: 1; grid-row: 1 / span 2; max-width: none; align-items: flex-start; }
      #manualPanel   { grid-column: 1; grid-row: 1 / span 2; max-width: none; }
      .history-panel { grid-column: 2; grid-row: 1; max-width: none; padding: 20px 24px; gap: 10px; }
      .counter       { grid-column: 2; grid-row: 2; font-size: 0.88rem; }

      /* ── カメラ ── */
      /* 縦に収まるようカメラ（正方形）の最大サイズを画面高で制限 */
      .camera-wrap { max-width: min(100%, calc(100dvh - 330px)); border-radius: 20px; border-width: 3px; }
      #btnFlip     { width: 54px; height: 54px; top: 16px; right: 16px; }
      #btnFlip svg { width: 28px; height: 28px; }
      .status      { font-size: 1rem; margin-top: 6px; }

      /* スキャン枠：iPadは枠・コーナー・案内文を大きく */
      .scan-window { width: 60%; border-width: 3px; }
      .sw-corner   { width: 48px; height: 48px; border-width: 6px; }

      /* ── 受付履歴パネル（iPad） ── */
      .history-panel > label { font-size: 0.75rem; }
      .hist-item             { padding: 10px 0; }
      .hist-name             { font-size: 1.1rem; }
      .hist-item.latest .hist-name { font-size: 1.25rem; }
      .hist-meta             { font-size: 0.8rem; }

      /* ── サブタブ ── */
      .sub-tab { padding: 14px 10px; font-size: 0.95rem; }

      /* ── 番号入力 ── */
      .num-display    { padding: 18px 24px; border-radius: 14px; }
      .num-digits     { font-size: 3rem; letter-spacing: 0.3em; }
      .num-name       { font-size: 1.1rem; min-height: 1.6em; }
      .num-hint       { font-size: 0.82rem; }

      /* ── テンキー：立ったまま操作しやすいサイズ ── */
      .numpad { gap: 12px; }
      .key {
        padding: 24px 0;
        font-size: 1.8rem;
        border-radius: 14px;
        border-width: 2px;
      }
      .key.del   { font-size: 1.4rem; }

      /* ── 送信・クリアボタン ── */
      .manual-actions { gap: 12px; margin-top: 4px; }
      .btn-submit     { padding: 20px; font-size: 1.15rem; border-radius: 14px; }
      .btn-clear      { padding: 20px; font-size: 1rem;    border-radius: 14px; }

      /* ── 名前検索（iPad：左キーボード／右 全候補スクロール 2カラム） ── */
      /* 手入力モードではパネルを全幅に */
      body.mode-manual #manualPanel { grid-column: 1 / -1; }

      #namePane {
        display: grid;
        grid-template-columns: 460px 1fr;
        gap: 28px; align-items: start;
      }
      .np-left  { gap: 12px; position: sticky; top: 0; }
      .name-subhint    { display: block; }
      .name-search-box { padding: 16px 22px; border-radius: 16px; border-width: 2px; }
      #nameInput       { font-size: 1.5rem; }
      .name-search-box span { font-size: 1.4rem; }
      #nameClear       { font-size: 1.5rem; }

      /* 右：候補を全員スクロール表示 */
      .name-results  { max-height: calc(100dvh - 220px); gap: 10px; }
      .name-result   { padding: 18px 22px; border-radius: 14px; gap: 5px; }
      .name-result:active { border-width: 2px; }
      .nr-name { font-size: 1.4rem; }
      .nr-kana { font-size: 1rem; }
      .nr-id   { font-size: 0.9rem; margin-top: 2px; }
      .name-msg { font-size: 1rem; padding: 32px 0; }

      /* フリックキーボード本体 */
      .flick-kb {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px; margin-top: 4px;
      }
      .flick-key {
        position: relative;
        background: #1a1a24; border: 2px solid #2a2a3a; border-radius: 16px;
        height: 78px; display: flex; align-items: center; justify-content: center;
        font-size: 2.1rem; font-weight: 700; color: #d0d0f0;
        cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none;
      }
      .flick-key.pressing { background: #2a2a4a; border-color: #7c6fff; }
      .flick-key.special  { font-size: 1.5rem; color: #9080c0; }

      /* フリックポップアップ（十字） */
      #flick-popup {
        position: fixed; z-index: 300; pointer-events: none;
        width: 192px; height: 192px; transform: translate(-50%, -50%);
      }
      #flick-popup.show { display: block; }
      .fp-cell {
        position: absolute; width: 62px; height: 62px;
        display: flex; align-items: center; justify-content: center;
        background: #2e2e42; color: #fff; font-size: 1.8rem; font-weight: 700;
        border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      }
      .fp-cell.c { left: 65px; top: 65px; background: #3a3a5a; }
      .fp-cell.u { left: 65px; top: 0; }
      .fp-cell.d { left: 65px; top: 130px; }
      .fp-cell.l { left: 0;   top: 65px; }
      .fp-cell.r { left: 130px; top: 65px; }
      .fp-cell.active { background: #7c6fff; transform: scale(1.08); }
      .fp-cell.hidden { display: none; }

      /* ── 確認モーダル ── */
      .cf-box    { max-width: 520px; padding: 44px 40px; gap: 14px; border-radius: 24px; }
      .cf-label  { font-size: 0.8rem; }
      .cf-name   { font-size: 2.6rem; }
      .cf-id     { font-size: 0.95rem; }
      .cf-btns   { gap: 14px; margin-top: 18px; }
      .cf-ok     { padding: 22px; font-size: 1.15rem; border-radius: 14px; }
      .cf-cancel { padding: 22px; font-size: 1.05rem; border-radius: 14px; }

      /* ── 結果オーバーレイ ── */
      .ov-icon    { width: 88px; height: 88px; margin-bottom: 24px; }
      .ov-icon svg { width: 44px; height: 44px; }
      .ov-name    { font-size: clamp(2.8rem, 6vw, 4.5rem); margin-bottom: 14px; }
      .ov-meta    { font-size: 1.2rem; }
      .ov-ticket  { font-size: 2.1rem; padding: 14px 32px; margin-top: 18px; }
      .ov-welcome { font-size: clamp(1.2rem, 3vw, 1.8rem); margin-top: 22px; }
      .ov-sub     { font-size: 0.9rem; margin-top: 10px; }
      .ov-hint    { margin-top: 32px; font-size: 0.8rem; }
    }
  </style>
</head>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
  const VERSION     = '2026.08.21-r50';
  const GAS_URL     = 'https://script.google.com/macros/s/AKfycbztpKZ4IqnsHPdtK_7Fin3Fa6loGudSSaORdXlmEGT5qowt1xRy3VryTsBxo7lF0wBUrw/exec';
  const MEMBERS_API = 'https://sop-dance.com/member/api/members.php';
  const TICKET_API  = 'https://sop-dance.com/member/api/ticket.php';
  const CLASSES_API = 'https://sop-dance.com/member/api/classes.php';

  // ── 受付モード（月謝 / 回数券） ─────────────────────
  // 時間割から自動で切り替える。手で選んだときは、次にクラスが変わるまでその選択を優先する。
  const LEAD_MIN  = 20;   // レッスン開始の何分前から切り替えるか
  const AFTER_MIN = 30;   // 開始から何分後まで、そのクラスの受付とみなすか

  let receptionMode = localStorage.getItem('sop_reception_mode') || 'monthly';
  let classList     = null;   // 時間割（classes.php から取得）
  let autoMode      = null;   // いまの時間割から決まるモード
  let manualUntil   = null;   // 手動で選んだときの「解除の目印」＝そのときの自動モード

  function setReceptionMode(mode, opts) {
    const byUser = !opts || opts.byUser !== false;   // 既定は「人が押した」
    receptionMode = mode;
    localStorage.setItem('sop_reception_mode', mode);
    document.getElementById('msMonthly').classList.toggle('active', mode === 'monthly');
    document.getElementById('msTicket').classList.toggle('active',  mode === 'ticket');
    document.body.classList.toggle('ticket-mode', mode === 'ticket');
    if (byUser) {
      // 押した時点の自動モードを覚えておき、それが変わったら自動に戻す
      manualUntil = autoMode;
      localStorage.setItem('sop_mode_manual_from', autoMode || '');
    }
    renderModeBadge();
  }

  // 手動になっているかを小さく示す。タップで自動へ戻す
  function renderModeBadge() {
    const el = document.getElementById('modeBadge');
    if (!el) return;
    const manual = manualUntil !== null && receptionMode !== autoMode;
    el.style.display = manual ? '' : 'none';
  }

  function backToAuto() {
    manualUntil = null;
    localStorage.removeItem('sop_mode_manual_from');
    applyAutoMode(true);
  }

  // 時間割を読む（起動時と、30分ごと）
  async function loadClasses() {
    try {
      const res = await fetch(CLASSES_API);
      const data = await res.json();
      if (data.success) classList = data.classes;
    } catch (_) { /* 取れなければ手動運用のまま */ }
    applyAutoMode();
  }

  // いまの時刻に該当するクラスから、あるべきモードを決める。
  // 開始20分前〜開始30分後を「そのクラスの受付中」とみなし、
  // 回数券クラスと月謝クラスが重なる時間帯（木19:10など）は回数券を優先する
  //（月謝の生徒を回数券モードで読んでも、回数券の行は出ないため実害がない）。
  function computeAutoMode(now) {
    if (!classList || !classList.length) return null;
    const wd  = ['sun','mon','tue','wed','thu','fri','sat'][now.getDay()];
    const min = now.getHours() * 60 + now.getMinutes();
    let found = null;
    for (const c of classList) {
      if (c.weekday !== wd) continue;
      if (min < c.start - LEAD_MIN || min > c.start + AFTER_MIN) continue;
      if (c.ticket) return 'ticket';    // 回数券クラスが1つでもあれば回数券
      found = 'monthly';
    }
    return found;                        // 該当なしは null＝いまのモードを保つ
  }

  function applyAutoMode(force) {
    const next = computeAutoMode(new Date());
    if (next === null) { renderModeBadge(); return; }   // 対象のクラスが無い時間帯は変えない
    const changed = next !== autoMode;
    autoMode = next;
    // 手動で選んでいる間は変えない。ただし自動モードが変わったら（＝次のクラスに移ったら）自動に戻す
    if (!force && manualUntil !== null && !changed) { renderModeBadge(); return; }
    manualUntil = null;
    localStorage.removeItem('sop_mode_manual_from');
    if (receptionMode !== next) setReceptionMode(next, { byUser: false });
    else renderModeBadge();
  }

  // 回数券：残数をオーバーレイに表示する（読み取りだけ。消費は出欠管理のクラス確定で行う）
  async function logTicketScan(memberId, fullName) {
    const el = document.getElementById('ovTicket');
    try {
      const res = await fetch(TICKET_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'scan', member_id: memberId, member_name: fullName, class_label: '回数券クラス' })
      });
      const result = await res.json();
      if (!result.success) throw new Error(result.message);
      // 試験運用中は残数を出さない（まだ回数を配っていないため）
      if (result.trial) {
        el.className = 'ov-ticket info';
        el.textContent = '🎫 デジタル回数券は準備中です';
        return;
      }
      // 月謝だけの生徒には回数券の行を出さない（自動切替で回数券モードのまま読むことがある）
      if (!result.is_ticket_member) {
        el.className = 'ov-ticket';
        el.textContent = '';
        return;
      }
      // デジタルを受け取っていない人（紙チケットのみ）に「残りがありません」は事実と違う
      if (!result.has_digital) {
        el.className = 'ov-ticket info';
        el.textContent = '🎫 紙のチケットをご利用中です';
        return;
      }
      if (result.remaining > 0) {
        // 「いまの残り → 今回のクラスを確定したあとの残り」を見せる。
        // どちらの数字か迷わないように、確定後を大きくする。
        const after = result.remaining - 1;
        el.className = 'ov-ticket ok';
        el.innerHTML =
          '<span class="tk-label">🎫 残り回数</span>' +
          '<span class="tk-from">' + result.remaining + '</span>' +
          '<span class="tk-arrow">→</span>' +
          '<span class="tk-to">' + after + '</span>' +
          '<span class="tk-unit">回</span>' +
          (after === 0 ? '<span class="tk-note">今回で最後の1回です</span>' : '');
      } else {
        el.className = 'ov-ticket warn';
        el.textContent = '⚠ 回数券の残りがありません（要購入）';
      }
    } catch (_) {
      el.className = 'ov-ticket warn';
      el.textContent = '⚠ 回数券情報を取得できませんでした';
    }
  }
  const OVERLAY_SEC = 2;

  document.getElementById('versionFooter').textContent = 'v' + VERSION;

  // ── 状態 ────────────────────────────────────────────
  let memberCache   = null;
  let lastScanned   = '';
  let cooldownUntil = 0;
  let scanCount       = 0;
  let recentCheckins  = [];
  const MAX_HISTORY_SP  = 3;   // スマホ：3件
  const MAX_HISTORY_PAD = 5;   // iPad ：5件
  let dismissTimer  = null;
  let audioCtx      = null;
  let currentMode   = 'qr';

  // ── 時計 ────────────────────────────────────────────
  const WD = ['日','月','火','水','木','金','土'];
  function updateClock() {
    const n = new Date();
    document.getElementById('hdDate').textContent =
      n.getFullYear() + '年' + String(n.getMonth()+1).padStart(2,'0') + '月' +
      String(n.getDate()).padStart(2,'0') + '日（' + WD[n.getDay()] + '）';
    document.getElementById('hdClock').textContent =
      String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
  }
  updateClock();
  setInterval(updateClock, 1000);

  const IS_IPAD = window.innerWidth >= 768;


  // ── フリックキーボード（名前検索用・iPad） ──────────
  // 各キー：c=中央(タップ), u=上, d=下, l=左, r=右
  const FLICK_KEYS = [
    { c:'あ', l:'い', u:'う', r:'え', d:'お' },
    { c:'か', l:'き', u:'く', r:'け', d:'こ' },
    { c:'さ', l:'し', u:'す', r:'せ', d:'そ' },
    { c:'た', l:'ち', u:'つ', r:'て', d:'と' },
    { c:'な', l:'に', u:'ぬ', r:'ね', d:'の' },
    { c:'は', l:'ひ', u:'ふ', r:'へ', d:'ほ' },
    { c:'ま', l:'み', u:'む', r:'め', d:'も' },
    { c:'や', u:'ゆ', d:'よ' },
    { c:'ら', l:'り', u:'る', r:'れ', d:'ろ' },
    { c:'゛゜', special:'daku' },
    { c:'わ', l:'を', u:'ん', r:'ー' },
    { c:'⌫', special:'del' },
  ];
  // ゛゜キーで循環する文字グループ
  const VARIANT_GROUPS = [
    ['か','が'],['き','ぎ'],['く','ぐ'],['け','げ'],['こ','ご'],
    ['さ','ざ'],['し','じ'],['す','ず'],['せ','ぜ'],['そ','ぞ'],
    ['た','だ'],['ち','ぢ'],['つ','づ','っ'],['て','で'],['と','ど'],
    ['は','ば','ぱ'],['ひ','び','ぴ'],['ふ','ぶ','ぷ'],['へ','べ','ぺ'],['ほ','ぼ','ぽ'],
    ['あ','ぁ'],['い','ぃ'],['う','ぅ'],['え','ぇ'],['お','ぉ'],
    ['や','ゃ'],['ゆ','ゅ'],['よ','ょ'],['わ','ゎ'],
  ];

  let flickState = null;

  function buildFlickKeyboard() {
    const kb = document.getElementById('flickKeyboard');
    FLICK_KEYS.forEach(def => {
      const key = document.createElement('div');
      key.className = 'flick-key' + (def.special ? ' special' : '');
      key.textContent = def.c;
      key.addEventListener('pointerdown', e => flickDown(e, key, def));
      kb.appendChild(key);
    });
    // ポップアップ外でのpointermove/up も拾う
    window.addEventListener('pointermove', flickMove);
    window.addEventListener('pointerup',   flickUp);
  }

  function flickDown(e, key, def) {
    e.preventDefault();
    flickState = { def, key, x: e.clientX, y: e.clientY, dir: 'c' };
    key.classList.add('pressing');
    if (!def.special) showFlickPopup(e.clientX, e.clientY, def);
  }

  function flickMove(e) {
    if (!flickState || flickState.def.special) return;
    const dx = e.clientX - flickState.x, dy = e.clientY - flickState.y;
    const TH = 26;
    let dir = 'c';
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx >  TH) dir = 'r'; else if (dx < -TH) dir = 'l';
    } else {
      if (dy >  TH) dir = 'd'; else if (dy < -TH) dir = 'u';
    }
    if (dir !== 'c' && !flickState.def[dir]) dir = 'c';
    flickState.dir = dir;
    highlightFlick(dir);
  }

  function flickUp() {
    if (!flickState) return;
    const { def, key, dir } = flickState;
    key.classList.remove('pressing');
    hideFlickPopup();
    if (def.special === 'del')  { kanaDelete(); }
    else if (def.special === 'daku') { kanaDakuten(); }
    else { kanaAppend(def[dir] || def.c); }
    flickState = null;
  }

  function kanaAppend(ch) {
    const el = document.getElementById('nameInput');
    el.value += ch; onNameInput();
  }
  function kanaDelete() {
    const el = document.getElementById('nameInput');
    el.value = el.value.slice(0, -1); onNameInput();
  }
  function kanaDakuten() {
    const el = document.getElementById('nameInput');
    const last = el.value.slice(-1);
    if (!last) return;
    for (const g of VARIANT_GROUPS) {
      const i = g.indexOf(last);
      if (i !== -1) { el.value = el.value.slice(0,-1) + g[(i+1) % g.length]; onNameInput(); return; }
    }
  }

  function showFlickPopup(x, y, def) {
    const pop = document.getElementById('flick-popup');
    pop.style.left = x + 'px';
    pop.style.top  = y + 'px';
    ['c','u','d','l','r'].forEach(d => {
      const cell = pop.querySelector('.fp-cell.' + d);
      const ch = def[d];
      cell.textContent = ch || '';
      cell.classList.toggle('hidden', !ch);
      cell.classList.toggle('active', d === 'c');
    });
    pop.classList.add('show');
  }
  function highlightFlick(dir) {
    const pop = document.getElementById('flick-popup');
    ['c','u','d','l','r'].forEach(d => {
      pop.querySelector('.fp-cell.' + d).classList.toggle('active', d === dir);
    });
  }
  function hideFlickPopup() {
    document.getElementById('flick-popup').classList.remove('show');
  }

  // ── モード切り替え ──────────────────────────────────
  function switchMode(mode) {
    currentMode = mode;
    document.getElementById('tabQr').classList.toggle('active', mode === 'qr');
    document.getElementById('tabManual').classList.toggle('active', mode === 'manual');
    document.getElementById('qrPanel').style.display     = mode === 'qr'     ? 'flex' : 'none';
    document.getElementById('manualPanel').style.display = mode === 'manual' ? 'flex' : 'none';
    document.body.classList.toggle('mode-manual', mode === 'manual');
    document.body.classList.toggle('mode-qr',     mode === 'qr');

    if (mode === 'qr') {
      startCamera();
    } else {
      stopCamera();
      // 名前検索：iPadはフリックキーボード（左側常時表示）、スマホはネイティブキーボード
      clearNameSearch();        // 検索欄リセット＋候補一覧を初期表示
      if (!IS_IPAD) document.getElementById('nameInput').focus();
    }
  }

  // ── 受付履歴 ────────────────────────────────────────
  function pushHistory(fullName, memberId) {
    const n    = new Date();
    const time = String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
    recentCheckins.unshift({ name: fullName, memberId, time });
    const max = IS_IPAD ? MAX_HISTORY_PAD : MAX_HISTORY_SP;
    if (recentCheckins.length > max) recentCheckins.length = max;
    renderHistory();
  }

  function renderHistory() {
    const el = document.getElementById('historyList');
    if (!recentCheckins.length) {
      el.innerHTML = '<p class="hist-empty">—</p>';
      return;
    }
    el.innerHTML = recentCheckins.map((item, i) =>
      `<div class="hist-item${i === 0 ? ' latest' : ''}">
        <p class="hist-name">${item.name}</p>
        <p class="hist-meta">${item.memberId}　${item.time}</p>
      </div>`
    ).join('');
  }

  // ── 会員キャッシュ ──────────────────────────────────
  async function warmupMembers() {
    try {
      const res = await fetch(MEMBERS_API);
      const result = await res.json();
      if (result.success) {
        memberCache = result.members;
        const dot = document.getElementById('cacheDot');
        dot.classList.add('ready');
        dot.title = '会員データ ' + Object.keys(memberCache).length + '件 読込済';
      }
    } catch (_) {}
  }

  function findMember(memberId) {
    if (memberCache && memberCache[memberId]) {
      const m = memberCache[memberId];
      return m.lastName + '　' + m.firstName;
    }
    return null;
  }

  // ── 名前検索 ────────────────────────────────────────
  // カタカナ→ひらがな変換（検索時に統一）
  function toHira(str) {
    return str.replace(/[ァ-ヶ]/g, c =>
      String.fromCharCode(c.charCodeAt(0) - 0x60)
    );
  }
  // スペース正規化（全角→半角、連続→1つ）
  function normStr(str) {
    return toHira(str.replace(/　/g, ' ').replace(/\s+/g, ' ').trim().toLowerCase());
  }

  // 「カードを忘れた方」の手入力検索に出してよい会員か（在籍中のみ）
  // 休会・退会・卒業会員は対象外。QRスキャン側の受付処理には影響しない。
  function isActiveMember(m) {
    return m.status2 === '在籍';
  }

  function searchMembers(query) {
    if (!memberCache || !query.trim()) return [];
    const terms = normStr(query).split(' ').filter(t => t.length > 0);
    if (!terms.length) return [];
    const results = [];
    for (const [id, m] of Object.entries(memberCache)) {
      if (!isActiveMember(m)) continue;
      // 「名（first name）」系フィールドを除外し、姓・姓かな・フルかな等のみ対象にする
      const fields = Object.entries(m)
        .filter(([key, val]) => {
          if (typeof val !== 'string' || !val) return false;
          const k = key.toLowerCase();
          // firstName / firstNameKana / mei / meiKana 等を除外
          return !(k.startsWith('first') || k.startsWith('mei') || k === 'name1' || k === 'namei');
        })
        .map(([, val]) => normStr(val));

      // 各検索ワードが「いずれかの姓フィールドの先頭」に一致するか（前方一致）
      const matched = terms.every(term =>
        fields.some(field => field.startsWith(term))
      );
      if (matched) results.push([id, m]);
    }
    return sortByKana(results);
  }

  // ふりがな（姓→名）順で並べ替え
  function sortByKana(list) {
    return list.sort((a, b) => {
      const ka = ((a[1].lastName || '') + (a[1].firstName || ''));
      const kb = ((b[1].lastName || '') + (b[1].firstName || ''));
      return ka.localeCompare(kb, 'ja');
    });
  }

  // 全会員（在籍中のみ・ふりがな順）
  function allMembersSorted() {
    if (!memberCache) return [];
    return sortByKana(Object.entries(memberCache).filter(([, m]) => isActiveMember(m)));
  }

  // デバッグ: 会員データ構造を確認する関数（コンソールから呼べます）
  window.debugMember = function(name) {
    if (!memberCache) { console.log('キャッシュ未読込'); return; }
    const q = normStr(name);
    Object.entries(memberCache).forEach(([id, m]) => {
      const hay = normStr(Object.values(m).filter(v=>typeof v==='string').join(' '));
      if (hay.includes(q.split(' ')[0])) {
        console.log('--- 会員ID:', id);
        console.log('  フィールド:', JSON.stringify(m, null, 2));
        console.log('  検索文字列:', hay);
      }
    });
  };

  function getKana(m) {
    // よくあるフィールド名を試みる
    const last  = m.lastNameKana  || m.lastNameFurigana  || m.seiKana  || '';
    const first = m.firstNameKana || m.firstNameFurigana || m.meiKana  || '';
    if (last || first) return (last + '　' + first).trim();
    return m.nameKana || m.furigana || m.kana || '';
  }

  function renderNameResults(results) {
    const el = document.getElementById('nameResults');
    if (!results.length) {
      el.innerHTML = '<p class="name-msg">該当する会員が見つかりません</p>';
      return;
    }
    el.innerHTML = results.map(([id, m]) => {
      const name = (m.lastName || '') + '　' + (m.firstName || '');
      const kana = getKana(m);
      return `<div class="name-result" onclick="selectMember('${id}')">
        <div class="nr-name">${name}</div>
        ${kana ? `<div class="nr-kana">${kana}</div>` : ''}
        <div class="nr-id">会員番号：${id}</div>
      </div>`;
    }).join('');
  }

  function onNameInput() {
    const q = document.getElementById('nameInput').value;
    document.getElementById('nameClear').classList.toggle('show', q.length > 0);
    const el = document.getElementById('nameResults');

    if (!memberCache) {
      el.innerHTML = '<p class="name-msg">会員データ読込中…</p>';
      return;
    }
    if (!q.trim()) {
      // iPad：全候補をスクロール表示／スマホ：案内文
      if (IS_IPAD) renderNameResults(allMembersSorted());
      else el.innerHTML = '<p class="name-msg">ふりがなを入力すると候補が表示されます</p>';
      return;
    }
    renderNameResults(searchMembers(q));
  }

  function clearNameSearch() {
    document.getElementById('nameInput').value = '';
    document.getElementById('nameClear').classList.remove('show');
    onNameInput(); // 候補一覧を初期表示に戻す（iPadは全員表示）
    if (!IS_IPAD) document.getElementById('nameInput').focus();
  }

  let pendingMemberId = null;

  function selectMember(memberId) {
    const m = memberCache && memberCache[memberId];
    const name = m ? (m.lastName + '　' + m.firstName) : '（名前なし）';
    pendingMemberId = memberId;
    document.getElementById('cfName').textContent = name;
    document.getElementById('cfId').textContent   = '会員番号：' + memberId;
    document.getElementById('confirm-overlay').classList.add('visible');
  }

  async function confirmCheckin() {
    if (!pendingMemberId) return;
    const id = pendingMemberId;
    pendingMemberId = null;
    document.getElementById('confirm-overlay').classList.remove('visible');
    clearNameSearch();
    await processCheckin(id, '手入力（名前検索）');
    switchMode('qr'); // 申請後は自動でQR読み取りに戻る
  }

  function cancelConfirm() {
    pendingMemberId = null;
    document.getElementById('confirm-overlay').classList.remove('visible');
  }

  // ── QR解析 ──────────────────────────────────────────
  // 対応フォーマット：
  //   1. 旧会員証: Googleフォーム等のURL末尾 /r/XXXXXX
  //   2. 新会員証: sop:XXXXXX（2026年8月〜）
  //   3. 生の6桁数字
  function extractMemberId(text) {
    const t = text.trim();
    const sop = t.match(/^sop:(\d{6})$/i);   // 新フォーマット sop:123456
    if (sop) return sop[1];
    const url = t.match(/\/r\/(\d{6})\/?$/); // 旧フォーマット（URL埋め込み）
    if (url) return url[1];
    if (/^\d{6}$/.test(t)) return t;
    return null;
  }

  // ── 音 ──────────────────────────────────────────────
  function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }
  function playBeep() {
    const ctx = getCtx(), osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(2000, ctx.currentTime);
    gain.gain.setValueAtTime(0.86, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.453);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.5);
  }
  function playBass() {
    const ctx = getCtx(), osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.frequency.value = 60;
    gain.gain.setValueAtTime(2.0, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.3);
  }
  function playError() {
    const ctx = getCtx(), osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(300, ctx.currentTime);
    osc.frequency.setValueAtTime(180, ctx.currentTime + 0.18);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.45);
  }

  // ── フラッシュ ───────────────────────────────────────
  function flashScreen() {
    const el = document.getElementById('flash');
    el.classList.remove('active'); void el.offsetWidth; el.classList.add('active');
  }

  // ── オーバーレイ ─────────────────────────────────────
  const overlay = document.getElementById('result-overlay');

  function showOverlay({ name, meta, type = 'ok', sec = OVERLAY_SEC }) {
    const icon = document.getElementById('ovIcon');
    icon.className = 'ov-icon ' + type;
    icon.innerHTML = type === 'ok'
      ? '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'
      : '<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

    const label = document.getElementById('ovLabel');
    label.textContent = type === 'ok' ? '受付完了' : 'エラー';
    label.className   = 'ov-label ' + type;

    document.getElementById('ovName').textContent      = name || '';
    document.getElementById('ovMeta').textContent      = meta || '';

    document.getElementById('ovTicket').className      = 'ov-ticket'; // 一旦隠す（回数券モード時のみ表示）

    icon.style.animation = 'none'; void icon.offsetWidth; icon.style.animation = '';

    const prog = document.getElementById('ovProgress');
    prog.style.setProperty('--dur', sec + 's');
    prog.classList.remove('run'); void prog.offsetWidth; prog.classList.add('run');

    overlay.classList.add('visible');
    clearTimeout(dismissTimer);
    dismissTimer = setTimeout(hideOverlay, sec * 1000);
  }

  function hideOverlay() {
    overlay.classList.remove('visible');
    clearTimeout(dismissTimer);
  }

  overlay.addEventListener('click', hideOverlay);

  // ── GAS送信 ──────────────────────────────────────────
  async function submitAttendance(memberId, fullName, note = '会員証QR') {
    const params = new URLSearchParams({
      action: 'submitAttendance',
      name: (fullName || '（名前なし）') + '　' + memberId,
      note
    });
    const res    = await fetch(GAS_URL + '?' + params);
    const result = await res.json();
    if (!result.success) throw new Error(result.message || '送信失敗');
  }

  // ── 受付共通処理 ─────────────────────────────────────
  async function processCheckin(memberId, note = '会員証QR') {
    const fullName = findMember(memberId) || '（名前なし）';

    pushHistory(fullName, memberId);
    scanCount++;
    document.getElementById('counter').textContent = '本日の受付: ' + scanCount + ' 件';

    flashScreen();
    if (navigator.vibrate) navigator.vibrate(200);
    getCtx().resume().then(() => { playBass(); playBeep(); });

    showOverlay({ name: fullName, meta: '会員番号：' + memberId, type: 'ok' });

    // 回数券モード：残回数をオーバーレイに表示（読み取りのみ）
    if (receptionMode === 'ticket') logTicketScan(memberId, fullName);
    // ※ 以前はここで直前に読み取った会員を窓口対応画面へ引き継いでいたが、
    //   窓口に来る方は会員証を持っていないことが多いので廃止した（2026-08-21）。
    //   窓口画面は常にふりがな検索から始まる。

    try {
      await submitAttendance(memberId, fullName, note + (receptionMode === 'ticket' ? '・回数券' : ''));
      document.getElementById('ovSub').textContent = '✓ 記録完了';
    } catch (err) {
      document.getElementById('ovSub').textContent = '⚠ 記録に失敗しました';
    }
  }

  // ── QRスキャン処理 ───────────────────────────────────
  async function handleScan(rawText) {
    const memberId = extractMemberId(rawText);
    // 会員証QR以外は完全に無視
    if (!memberId) return;
    await processCheckin(memberId, '会員証QR');
  }

  // ── カメラ ───────────────────────────────────────────
  const video  = document.getElementById('video');
  const canvas = document.createElement('canvas');
  const ctx2d  = canvas.getContext('2d');
  let facingMode    = 'environment';
  let currentStream = null;

  function stopCamera() {
    if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
  }

  // iPad かつフロントカメラのときだけ、表示を左右反転（鏡像）にする
  // ※ QR読み取りは実映像から行うため精度には影響しない
  function updateMirror() {
    const mirror = IS_IPAD && facingMode === 'user';
    video.classList.toggle('mirror', mirror);
  }

  async function startCamera() {
    stopCamera();
    updateMirror();
    const status = document.getElementById('status');
    status.className = 'status';
    status.textContent = 'カメラを起動中…';
    try {
      currentStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode, width: { ideal: 640 }, height: { ideal: 640 } }
      });
      video.srcObject = currentStream;
      video.play().catch(() => {});     // 復帰直後は再生が止まっていることがある
      // loadedmetadata を待たずに回し始める。
      // 復帰時は同じvideo要素を使い回すためイベントが飛ばないことがあり、
      // 待つ作りだと「カメラを起動中…」のまま止まってしまう。
      frameSeen = false;
      startTick();
    } catch (err) {
      status.textContent = 'カメラにアクセスできません';
      status.className = 'status error';
    }
  }

  // ── 画面に戻ってきたときのカメラ復帰 ────────────────
  // 「回数券の追加」などへ移動している間にカメラは止められる。
  // iPadでは戻っても前の画面がそのまま復元され起動処理が動かないので、
  // 復帰を検知して、止まっていたら入れ直す。
  function cameraIsDead() {
    if (!currentStream) return true;
    return currentStream.getTracks().every(t => t.readyState === 'ended');
  }
  function resumeCameraIfNeeded() {
    if (currentMode !== 'qr') return;      // 手入力中は何もしない
    if (cameraIsDead()) { startCamera(); return; }
    video.play().catch(() => {});          // 生きているのに止まっているだけなら再生し直す
    startTick();                           // 読み取りループも念のため起こす
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) resumeCameraIfNeeded(); });
  window.addEventListener('pageshow', resumeCameraIfNeeded);   // 「戻る」での復元も拾う
  window.addEventListener('focus',   resumeCameraIfNeeded);
  // 念のための自己点検。上のどれも拾えなかった場合でも、5秒ごとに見て自力で戻す
  setInterval(() => { if (!document.hidden) resumeCameraIfNeeded(); }, 5000);

  function flipCamera() {
    facingMode = facingMode === 'environment' ? 'user' : 'environment';
    updateMirror();
    startCamera();
  }

  // ── 読み取りループ ───────────────────────────────────
  // 画面が隠れている間は requestAnimationFrame が止まる。戻ったときに
  // 再開しないことがあり、それがスキャナーの止まる原因になる。
  // そこで「最後に回った時刻」を持ち、しばらく動いていなければ入れ直す。
  let tickRunning = false;
  let frameSeen   = false;   // 最初の映像が届いたか（案内文の切り替えに使う）
  let lastTickAt  = 0;
  let tickGen     = 0;       // 世代番号。古いループは静かに終わらせる

  function startTick() {
    if (tickRunning && Date.now() - lastTickAt < 3000) return;   // ちゃんと回っている
    tickRunning = true;
    const gen = ++tickGen;
    const loop = () => {
      if (gen !== tickGen) return;                      // 新しいループに引き継いだ
      if (currentMode !== 'qr') { tickRunning = false; return; }
      lastTickAt = Date.now();
      scanFrame();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }

  function scanFrame() {
    if (video.readyState !== video.HAVE_ENOUGH_DATA) return;
    if (!frameSeen) {          // 映像が来た時点で案内を出す（イベントに頼らない）
      frameSeen = true;
      const st = document.getElementById('status');
      st.className = 'status';
      st.textContent = '会員証QRをかざしてください';
    }
    canvas.width  = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx2d.drawImage(video, 0, 0);
    const imageData = ctx2d.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
    const now = Date.now();
    if (code && (code.data !== lastScanned || now > cooldownUntil)) {
      lastScanned   = code.data;
      cooldownUntil = now + 3000;
      handleScan(code.data);
    }
  }

  // ── 起動 ─────────────────────────────────────────────
  warmupMembers();
  document.body.classList.add('mode-qr');
  // 受付モードは時間割から自動で切り替える。前回の選択はつなぎとして復元しておく
  setReceptionMode(receptionMode, { byUser: false });
  loadClasses();                            // 時間割を読んで即反映
  setInterval(applyAutoMode, 30 * 1000);    // 30秒ごとに時刻を見て切り替え
  setInterval(loadClasses, 30 * 60 * 1000); // 30分ごとに時間割を読み直す（変更に追従）
  if (IS_IPAD) {
    // iPad：インカメラ初期設定・キーボード生成・ネイティブキーボード抑制
    facingMode = 'user';
    document.getElementById('nameInput').setAttribute('inputmode', 'none');
    buildFlickKeyboard();  // フリック（名前検索用）
  }
  startCamera();
</script>
</body>
</html>
